<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2 class="logo">Pemrograman Web</h2>
    </header>

    <main class="main-container">
        <section class="card">
            <header class="card-header">
                <h1>Selamat Datang</h1>
                <p>Silakan masuk ke akun Anda</p>
            </header>

            <form class="auth-form" id="form-login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="Masukkan kata sandi" required>
                </div>

                <button type="submit" class="submit-btn" id="tombol-masuk">Masuk</button>
                <p class="pesan" id="pesan"></p>
            </form>

            <footer class="card-footer">
                <p>Akun untuk mencoba:</p>
                <p><b>emilys</b> / <b>emilyspass</b></p>
            </footer>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
